[tool.poetry]
name = "votimeter-eu"
version = "1.0.0"
description = "Streamlit app to find your political alignment against Portuguese parties and European Parliament groups"
authors = ["Miguel Costa", "Rafael <ribeirobarbosarafael@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
streamlit = "^1.43.2"
pandas = "^2.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
